name: Android test APK

on:
  workflow_dispatch:
    inputs:
      test_api_url:
        description: 'Aparte HTTPS-test-API, inclusief /api/v1 (met migratie 12)'
        required: true
        type: string
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package*.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CI: '1'
      APK_PREVIEW: '1'
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_API_URL: ${{ inputs.test_api_url || vars.APK_TEST_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate test API configuration
        run: |
          node -e "require('./apps/mobile/app.config.js')({config: require('./apps/mobile/app.json').expo})"
      - run: npm ci --include=dev
      - name: Check native module resolution
        run: |
          node <<'NODE'
          const path = require('node:path');
          for (const name of ['expo-constants', 'expo-linking', 'expo-status-bar']) {
            const root = require(name + '/package.json').version;
            const mobile = require(require.resolve(name + '/package.json', { paths: [path.resolve('apps/mobile')] })).version;
            if (root !== mobile) throw new Error(name + ': native autolinking and mobile resolve different versions');
            console.log(name, root);
          }
          NODE
      - run: npm run build -w packages/shared
      - run: npm run type-check -w apps/mobile
      - run: npm run prebuild:android -w apps/mobile
      - name: Build standalone test APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Verify APK signature and prepare download
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$SIGNER" verify --verbose "$APK"
          cp "$APK" Glaszetter-Snel-Test.apk
          sha256sum Glaszetter-Snel-Test.apk > Glaszetter-Snel-Test.sha256
          node -e "require('fs').writeFileSync('Glaszetter-Snel-Test-build.json', JSON.stringify({commit:process.env.GITHUB_SHA,api:process.env.EXPO_PUBLIC_API_URL,versionCode:process.env.ANDROID_VERSION_CODE,run:process.env.GITHUB_RUN_ID},null,2))"
          cat Glaszetter-Snel-Test.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          path: Glaszetter-Snel-Test.apk
          archive: false
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: test-apk-buildgegevens
          path: |
            Glaszetter-Snel-Test.sha256
            Glaszetter-Snel-Test-build.json
          retention-days: 30
