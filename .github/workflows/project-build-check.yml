name: Project build check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'fix/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @glaszetter/shared

      - name: Type-check API
        run: npm run type-check --workspace @glaszetter/api

      - name: Type-check web
        run: npm run type-check --workspace @glaszetter/web

      - name: Type-check mobile
        run: npm run type-check --workspace @glaszetter/mobile

      - name: Run tests
        run: npm test
